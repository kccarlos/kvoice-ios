name: KVoice
options:
  bundleIdPrefix: io.github.kccarlos.kvoice
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  KVoiceKit:
    path: Packages/KVoiceKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  KVoice:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared/Intents
      # The keyboard UI, for the debug-only `-kvoiceKeyboardPreview` host.
      - path: Keyboard/Shared
    dependencies:
      - package: KVoiceKit
        product: KVoiceKit
      - target: KVoiceKeyboard
        embed: true
      - target: KVoiceWidgets
        embed: true
    entitlements:
      path: App/KVoice.entitlements
      properties:
        com.apple.security.application-groups:
          - $(KVOICE_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(KVOICE_KEYCHAIN_GROUP)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: KVoice
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: KVoice records your voice only while you dictate, to turn it into text.
        NSSpeechRecognitionUsageDescription: KVoice uses on-device speech recognition to transcribe your dictation.
        KVoiceAppGroup: $(KVOICE_APP_GROUP)
        KVoiceKeychainGroup: $(AppIdentifierPrefix)$(KVOICE_KEYCHAIN_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: io.github.kccarlos.kvoice.ios
            CFBundleURLSchemes: [kvoice]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kccarlos.kvoice.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  KVoiceKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard/Sources
      - path: Keyboard/Shared
    dependencies:
      # Core only: the keyboard must not link WhisperKit, Speech or
      # FoundationModels (extension memory limit).
      - package: KVoiceKit
        product: KVoiceCore
    entitlements:
      path: Keyboard/KVoiceKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - $(KVOICE_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(KVOICE_KEYCHAIN_GROUP)
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: KVoice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KVoiceAppGroup: $(KVOICE_APP_GROUP)
        KVoiceKeychainGroup: $(AppIdentifierPrefix)$(KVOICE_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kccarlos.kvoice.ios.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES

  KVoiceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets/Sources
      - path: Shared/Intents
    dependencies:
      - package: KVoiceKit
        product: KVoiceCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/KVoiceWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(KVOICE_APP_GROUP)
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: KVoice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KVoiceAppGroup: $(KVOICE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kccarlos.kvoice.ios.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) KVOICE_WIDGET_EXTENSION

  KVoiceKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/KVoiceKit/Tests/KVoiceKitTests
    dependencies:
      - package: KVoiceKit
        product: KVoiceKit
      - package: KVoiceKit
        product: KVoiceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kccarlos.kvoice.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KVoice:
    build:
      targets:
        KVoice: all
    test:
      targets:
        - KVoiceKitTests
    archive:
      config: Release
